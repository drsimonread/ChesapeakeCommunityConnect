{% extends "base/base.html" %}
{% load static %}

{% block head %}
<link href="https://unpkg.com/boxicons@2.1.1/css/boxicons.min.css" rel="stylesheet">
<title>Chesapeake Community Connect - Forums</title>
<script src="https://maps.googleapis.com/maps/api/js?key={{ GOOGLE_API_KEY }}&libraries=places"></script>
{% endblock head %}

{% block content %}
<div id="content" class="body">
    <h1>Chesapeake Community Connect</h1>
    <form action="{% url 'mapViewer:post_list' %}" id="contact-form" method="get">
        {{form.as_p}}
        <input type="submit" value="Submit">
    </form>
    {%for post in postList %}
    <ul>                         
        <li><a href="{% url 'mapViewer:post_detail' want=post.id %}">{{ post.title }}</a>
         </li>                      
     </ul> 
    {%endfor%}
    
</div>

{% endblock content %}
