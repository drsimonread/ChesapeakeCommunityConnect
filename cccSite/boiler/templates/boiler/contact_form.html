{% load static %}

<form
    action="{% url 'boiler:help' %}"
    id="contact-form"
    class="contact-form contact-form--help"
    method="post"
>
    {% csrf_token %}

    <div class="form-field">
        <label for="{{ form.sender.id_for_label }}">Your Name</label>
        {{ form.sender }}
        {{ form.sender.errors }}
    </div>

    <div class="form-field">
        <label for="{{ form.email.id_for_label }}">Email Address</label>
        {{ form.email }}
        {{ form.email.errors }}
    </div>

    <div class="form-field">
        <label for="{{ form.subject.id_for_label }}">Subject</label>
        {{ form.subject }}
        {{ form.subject.errors }}
    </div>

    <div class="form-field">
        <label for="{{ form.message.id_for_label }}">Your Message</label>
        {{ form.message }}
        {{ form.message.errors }}
    </div>

    <button type="submit" class="contact-submit">
        Send Message
    </button>
</form>
