{% load static %}
<link rel="stylesheet" href="{% static 'boiler/contact_formstyle.css' %}">

<form action="{% url 'boiler:help' %}" id="contact-form" class="contact-form--help" method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}
    <div class="contact-form__field">
        {{ field.label_tag }}
        {{ field }}
        {{ field.errors }}
    </div>
    {% endfor %}
    <button type="submit" class="button">Submit</button>
</form>
