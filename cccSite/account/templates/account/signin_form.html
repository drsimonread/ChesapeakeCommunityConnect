{% extends "account/accountBase.html" %}
{% block accHead %}
{% load static %}
<title>Chesapeake Community Connect - Sign In</title>
<link rel="stylesheet" type="text/css" href="{% static 'base/signinStyling.css' %}?v=2">
{% endblock accHead %}

{% block accountFunc %}
<section class="account-form-page">

    <h1 class="account-form-heading">Sign In</h1>

    {% if error %}
        <p class="account-form-error">{{ error }}</p>
    {% endif %}

    <form class="account-form signin-form"
          action="{% url 'account:signin_form' %}"
          method="post"
          autocomplete="off">

        {% csrf_token %}

        <div class="form-field">
            <label for="signin-username">Username:</label>
            <input class="account-form-input"
                   type="text"
                   id="signin-username"
                   name="username"
                   autocomplete="off"
                   required>
        </div>

        <div class="form-field">
            <label for="signin-password">Password:</label>
            <input class="account-form-input"
                   type="password"
                   id="signin-password"
                   name="password"
                   autocomplete="new-password"
                   required>
        </div>

        <div class="form-actions">
            <button class="form-button" type="submit">Sign In</button>
            <a class="form-button form-button--secondary"
               href="{% url 'account:signin' %}">Cancel</a>
        </div>

    </form>
</section>
{% endblock accountFunc %}
