{% extends "account/accountBase.html" %}
{% block accHead %}
{% load static %}
<title>Chesapeake Community Connect - Sign In</title>
<link rel="stylesheet" type="text/css" href="{% static 'base/signinStyling.css' %}">
<style>
     #cancel{
          display: block;
          box-sizing: border-box;
          width: 150px !important;
          margin: 10px 0 !important;
          padding: 10px !important;
          border: none !important;
          border-radius: 3px !important;
          background-color: #e0e0e0 !important;
          color: #00205c;
          font-size: 15px;
          text-align: center;
          text-decoration: none;
          cursor: pointer;
     }

     .signin-submit {
          display: block;
          box-sizing: border-box;
          width: 150px !important;
          margin: 10px 0 !important;
          padding: 10px !important;
          border: none !important;
          border-radius: 3px !important;
           background-color: #f3c10d;
          color: #00205c;
          font-size: 15px;
          text-align: center;
          text-decoration: none;
          cursor: pointer;
     }
     .signin-actions {
          display: flex;
          justify-content: center;
          gap: 1rem;
          width: 70%;
          margin: 1rem auto;
     }

     .signin-actions .signin-submit,
     .signin-actions #cancel {
          margin: 0 !important;
     }

     #signin-username,
     #signin-password {
          display: block;
          box-sizing: border-box;
          width: 70%;
          margin: 0.5rem auto 1rem;
     }

     #contact-form label,
     form label {
          display: block;
          width: 70%;
          margin: 0 auto;
          text-align: left;
     }

     .google-signin-widget {
          display: flex !important;
          justify-content: center !important;
          width: 100% !important;
          margin: 1rem auto !important;
     }

     #cancel:hover {
          background-color: #c0c0c0 !important;
          color: #00205c;
          text-decoration: none;
     }
     .signin-submit:hover {
           background-color: #f3c10d;
          color: #00205c;
          text-decoration: none;
     }
</style>
{% endblock accHead %}

{% block accountFunc %}
<div class="containerS1">
    <div class="wrapperS1">
        <h1 class="heading">
            Sign In
        </h1>
        {% if error %}
            <p class="help is-danger">{{ error }}</p>
        {% endif %}
        <form action="{% url 'account:signin_form' %}" method="post" autocomplete="off">
            {% csrf_token %}
            <label for="signin-username">Username:</label>
            <input class="input" type="text" id="signin-username" name="username"
                   autocomplete="off" required>
            <label for="signin-password">Password:</label>
            <input class="input" type="password" id="signin-password" name="password"
                   autocomplete="new-password" required>
            <div class="signin-actions">
                <input class="signin-submit" type="submit" value="Sign In">
                <a class="button" id="cancel" href="{% url 'account:signin' %}">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock accountFunc %}
