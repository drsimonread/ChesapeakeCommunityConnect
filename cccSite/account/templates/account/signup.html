{% extends "account/accountBase.html" %}
{% block accHead %}
<title>Chesapeake Community Connect - Create an Account</title>
{% endblock accHead %}

{% block accountFunc %}
<div class="containerS1">
    <div class="wrapperS1">
        <h1 class="heading">Create an Account</h1>
        {% if error %}
            <p class="help is-danger">{{ error }}</p>
        {% endif %}
        <form method="post" action="{% url 'account:signup' %}" autocomplete="off">
            {% csrf_token %}
            <div class="field">
                <label class="label" for="email">Email</label>
                <input class="input" type="email" id="email" name="email"
                       autocomplete="off" required>
            </div>
            <div class="field">
                <label class="label" for="username">Username</label>
                <input class="input" type="text" id="username" name="username"
                       maxlength="75" autocomplete="off" required>
            </div>
            <div class="field">
                <label class="label" for="displayname">Display name</label>
                <input class="input" type="text" id="displayname" name="displayname"
                       maxlength="75" autocomplete="off" required>
            </div>
            <div class="field">
                <label class="label" for="password">Password</label>
                <input class="input" type="password" id="password" name="password"
                       autocomplete="new-password" required>
            </div>
            <div class="field">
                <label class="label" for="confirmpassword">Confirm password</label>
                <input class="input" type="password" id="confirmpassword" name="confirmpassword"
                       autocomplete="new-password" required>
            </div>
            <button class="button is-link" type="submit">Create Account</button>
            <a class="button" href="{% url 'account:signin' %}">Cancel</a>
        </form>
    </div>
</div>
{% endblock accountFunc %}
