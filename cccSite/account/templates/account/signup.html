{% extends "account/accountBase.html" %}
{% block accHead %}
{% load static %}
<title>Chesapeake Community Connect - Create an Account</title>
<link rel="stylesheet" type="text/css" href="{% static 'base/signinStyling.css' %}?v=2">
{% endblock accHead %}

{% block accountFunc %}
<section class="account-form-page">

    <h1 class="account-form-heading">Create an Account</h1>

    {% if error %}
        <p class="account-form-error">{{ error }}</p>
    {% endif %}

    <form class="account-form signup-form"
          method="post"
          action="{% url 'account:signup' %}"
          autocomplete="off">

        {% csrf_token %}

        <div class="form-field">
            <label for="email">Email:</label>
            <input class="account-form-input"
                   type="email"
                   id="email"
                   name="email"
                   autocomplete="off"
                   required>
        </div>

        <div class="form-field">
            <label for="username">Username:</label>
            <input class="account-form-input"
                   type="text"
                   id="username"
                   name="username"
                   maxlength="75"
                   autocomplete="off"
                   required>
        </div>

        <div class="form-field">
            <label for="displayname">Display name:</label>
            <input class="account-form-input"
                   type="text"
                   id="displayname"
                   name="displayname"
                   maxlength="75"
                   autocomplete="off"
                   required>
        </div>

        <div class="form-field">
            <label for="password">Password:</label>
            <input class="account-form-input"
                   type="password"
                   id="password"
                   name="password"
                   autocomplete="new-password"
                   required>
        </div>

        <div class="form-field">
            <label for="confirmpassword">Confirm password:</label>
            <input class="account-form-input"
                   type="password"
                   id="confirmpassword"
                   name="confirmpassword"
                   autocomplete="new-password"
                   required>
        </div>

        <div class="form-actions">
            <button class="form-button" type="submit">Create Account</button>
            <a class="form-button form-button--secondary"
               href="{% url 'account:signin' %}">Cancel</a>
        </div>

    </form>
</section>
{% endblock accountFunc %}
