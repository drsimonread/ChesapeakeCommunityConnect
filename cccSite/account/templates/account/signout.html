{%extends "base/base.html"%}
{%block head%} 
<script src="https://accounts.google.com/gsi/client" async></script>
<title>Chesapeake Community Connect - Account</title>
{%endblock head%}
{% block content %}
<div id="content">
    You have been signed out.
</div>
<div id="g_id_onload"
     data-client_id="{{ google_client_id }}"
     data-context="signin"
     data-ux_mode="popup"
     data-login_uri="{% url 'account:authG' %}"
     data-auto_prompt="false">
</div>

<div class="g_id_signin"
     data-type="standard"
     data-shape="rectangular"
     data-theme="outline"
     data-text="signin"
     data-size="large"
     data-logo_alignment="left">
</div>

{% endblock content %}
